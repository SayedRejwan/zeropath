technique_id: T1001.002
name: Steganography
description: Adversaries may use steganographic techniques to hide command and control
  traffic to make detection efforts more difficult. Steganographic techniques can
  be used to hide data in digital messages that are transferred between systems. This
  hidden information can be used for command and control of compromised systems. In
  some cases, the passing of files embedded using steganography, such as image or
  document files, can be used for command and control.
