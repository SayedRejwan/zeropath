technique_id: T1027.003
name: Steganography
description: "Adversaries may use steganography techniques in order to prevent the\
  \ detection of hidden information. Steganographic techniques can be used to hide\
  \ data in digital media such as images, audio tracks, video clips, or text files.\n\
  \n[Duqu](https://attack.mitre.org/software/S0038) was an early example of malware\
  \ that used steganography. It encrypted the gathered information from a victim's\
  \ system and hid it within an image before exfiltrating the image to a C2 server.(Citation:\
  \ Wikipedia Duqu) \n\nBy the end of 2017, a threat group used <code>Invoke-PSImage</code> to\
  \ hide [PowerShell](https://attack.mitre.org/techniques/T1059/001) commands in an\
  \ image file (.png) and execute the code on a victim's system. In this particular\
  \ case the [PowerShell](https://attack.mitre.org/techniques/T1059/001) code downloaded\
  \ another obfuscated script to gather intelligence from the victim's machine and\
  \ communicate it back to the adversary.(Citation: McAfee Malicious Doc Targets Pyeongchang\
  \ Olympics)"
