technique_id: T1001.003
name: Protocol or Service Impersonation
description: "Adversaries may impersonate legitimate protocols or web service traffic\
  \ to disguise command and control activity and thwart analysis efforts. By impersonating\
  \ legitimate protocols or web services, adversaries can make their command and control\
  \ traffic blend in with legitimate network traffic.  \n\nAdversaries may impersonate\
  \ a fake SSL/TLS handshake to make it look like subsequent traffic is SSL/TLS encrypted,\
  \ potentially interfering with some security tooling, or to make the traffic look\
  \ like it is related with a trusted entity. \n\nAdversaries may also leverage legitimate\
  \ protocols to impersonate expected web traffic or trusted services. For example,\
  \ adversaries may manipulate HTTP headers, URI endpoints, SSL certificates, and\
  \ transmitted data to disguise C2 communications or mimic legitimate services such\
  \ as Gmail, Google Drive, and Yahoo Messenger.(Citation: ESET Okrum July 2019)(Citation:\
  \ Malleable-C2-U42)"
