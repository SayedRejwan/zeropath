schema_version: '1.0'
technique_id: T1027.005
name: Indicator Removal from Tools
description: 'Adversaries may remove indicators from tools if they believe their malicious
  tool was detected, quarantined, or otherwise curtailed. They can modify the tool
  by removing the indicator and using the updated version that is no longer detected
  by the target''s defensive systems or subsequent targets that may use similar systems.


  A good example of this is when malware is detected with a file signature and quarantined
  by anti-virus software. An adversary who can determine that the malware was quarantined
  because of its file signature may modify the file to explicitly avoid that signature,
  and then re-use the malware.'
