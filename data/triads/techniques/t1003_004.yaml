technique_id: T1003.004
name: LSA Secrets
description: 'Adversaries with SYSTEM access to a host may attempt to access Local
  Security Authority (LSA) secrets, which can contain a variety of different credential
  materials, such as credentials for service accounts.(Citation: Passcape LSA Secrets)(Citation:
  Microsoft AD Admin Tier Model)(Citation: Tilbury Windows Credentials) LSA secrets
  are stored in the registry at <code>HKEY_LOCAL_MACHINE\SECURITY\Policy\Secrets</code>.
  LSA secrets can also be dumped from memory.(Citation: ired Dumping LSA Secrets)


  [Reg](https://attack.mitre.org/software/S0075) can be used to extract from the Registry.
  [Mimikatz](https://attack.mitre.org/software/S0002) can be used to extract secrets
  from memory.(Citation: ired Dumping LSA Secrets)'
