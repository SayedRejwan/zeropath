schema_version: '1.0'
technique_id: T1007
name: System Service Discovery
description: 'Adversaries may try to gather information about registered local system
  services. Adversaries may obtain information about services using tools as well
  as OS utility commands such as <code>sc query</code>, <code>tasklist /svc</code>,
  <code>systemctl --type=service</code>, and <code>net start</code>. Adversaries may
  also gather information about schedule tasks via commands such as `schtasks` on
  Windows or `crontab -l` on Linux and macOS.(Citation: Elastic Security Labs GOSAR
  2024)(Citation: SentinelLabs macOS Malware 2021)(Citation: Splunk Linux Gormir 2024)(Citation:
  Aquasec Kinsing 2020)


  Adversaries may use the information from [System Service Discovery](https://attack.mitre.org/techniques/T1007)
  during automated discovery to shape follow-on behaviors, including whether or not
  the adversary fully infects the target and/or attempts specific actions.'
