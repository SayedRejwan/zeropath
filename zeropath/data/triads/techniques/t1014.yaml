technique_id: T1014
name: Rootkit
description: "Adversaries may use rootkits to hide the presence of programs, files,\
  \ network connections, services, drivers, and other system components. Rootkits\
  \ are programs that hide the existence of malware by intercepting/hooking and modifying\
  \ operating system API calls that supply system information. (Citation: Symantec\
  \ Windows Rootkits) \n\nRootkits or rootkit enabling functionality may reside at\
  \ the user or kernel level in the operating system or lower, to include a hypervisor\
  \ or [System Firmware](https://attack.mitre.org/techniques/T1542/001). (Citation:\
  \ Wikipedia Rootkit) Rootkits have been seen for Windows, Linux, and Mac OS X systems.\
  \ (Citation: CrowdStrike Linux Rootkit) (Citation: BlackHat Mac OSX Rootkit)\n\n\
  Rootkits that reside or modify boot sectors are known as [Bootkit](https://attack.mitre.org/techniques/T1542/003)s\
  \ and specifically target the boot process of the operating system."
