technique_id: T1021.008
name: Direct Cloud VM Connections
description: "Adversaries may leverage [Valid Accounts](https://attack.mitre.org/techniques/T1078)\
  \ to log directly into accessible cloud hosted compute infrastructure through cloud\
  \ native methods. Many cloud providers offer interactive connections to virtual\
  \ infrastructure that can be accessed through the [Cloud API](https://attack.mitre.org/techniques/T1059/009),\
  \ such as Azure Serial Console(Citation: Azure Serial Console), AWS EC2 Instance\
  \ Connect(Citation: EC2 Instance Connect)(Citation: lucr-3: Getting SaaS-y in the\
  \ cloud), and AWS System Manager.(Citation: AWS System Manager).\n\nMethods of authentication\
  \ for these connections can include passwords, application access tokens, or SSH\
  \ keys. These cloud native methods may, by default, allow for privileged access\
  \ on the host with SYSTEM or root level access. \n\nAdversaries may utilize these\
  \ cloud native methods to directly access virtual infrastructure and pivot through\
  \ an environment.(Citation: SIM Swapping and Abuse of the Microsoft Azure Serial\
  \ Console) These connections typically provide direct console access to the VM rather\
  \ than the execution of scripts (i.e., [Cloud Administration Command](https://attack.mitre.org/techniques/T1651))."
