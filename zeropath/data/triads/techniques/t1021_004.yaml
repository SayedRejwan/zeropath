schema_version: '1.0'
technique_id: T1021.004
name: SSH
description: 'Adversaries may use [Valid Accounts](https://attack.mitre.org/techniques/T1078)
  to log into remote machines using Secure Shell (SSH). The adversary may then perform
  actions as the logged-on user.


  SSH is a protocol that allows authorized users to open remote shells on other computers.
  Many Linux and macOS versions come with SSH installed by default, although typically
  disabled until the user enables it. On ESXi, SSH can be enabled either directly
  on the host (e.g., via `vim-cmd hostsvc/enable_ssh`) or via vCenter.(Citation: Sygnia
  ESXi Ransomware 2025)(Citation: TrendMicro ESXI Ransomware)(Citation: Sygnia Abyss
  Locker 2025) The SSH server can be configured to use standard password authentication
  or public-private keypairs in lieu of or in addition to a password. In this authentication
  scenario, the user’s public key must be in a special file on the computer running
  the server that lists which keypairs are allowed to login as that user (i.e., [SSH
  Authorized Keys](https://attack.mitre.org/techniques/T1098/004)).'
