technique_id: T1021.007
name: Cloud Services
description: "Adversaries may log into accessible cloud services within a compromised\
  \ environment using [Valid Accounts](https://attack.mitre.org/techniques/T1078)\
  \ that are synchronized with or federated to on-premises user identities. The adversary\
  \ may then perform management actions or access cloud-hosted resources as the logged-on\
  \ user. \n\nMany enterprises federate centrally managed user identities to cloud\
  \ services, allowing users to login with their domain credentials in order to access\
  \ the cloud control plane. Similarly, adversaries may connect to available cloud\
  \ services through the web console or through the cloud command line interface (CLI)\
  \ (e.g., [Cloud API](https://attack.mitre.org/techniques/T1059/009)), using commands\
  \ such as <code>Connect-AZAccount</code> for Azure PowerShell, <code>Connect-MgGraph</code>\
  \ for Microsoft Graph PowerShell, and <code>gcloud auth login</code> for the Google\
  \ Cloud CLI.\n\nIn some cases, adversaries may be able to authenticate to these\
  \ services via [Application Access Token](https://attack.mitre.org/techniques/T1550/001)\
  \ instead of a username and password."
