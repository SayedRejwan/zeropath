schema_version: '1.0'
technique_id: T1003.001
name: LSASS Memory
description: Adversaries may access Local Security Authority Subsystem Service memory to extract credential material on Windows systems.
kill_chain: [credential-access]
platforms: [Windows]
difficulty: high
status: reviewed
prerequisites:
  - Local administrator or SYSTEM access in an isolated Windows lab
room_refs: []
pentest_steps:
  - order: 1
    name: Capture an LSASS process dump
    tool: ProcDump
    command: 'procdump64.exe -accepteula -ma lsass.exe C:\Temp\lsass.dmp'
    prerequisite: ProcDump is installed and the lab account has local administrator rights.
    expected_result: A process dump is created and Windows records access to lsass.exe.
    safety: Run only inside an isolated authorized lab populated with synthetic credentials; delete the dump after evidence collection.
evidence:
  - name: LSASS process access
    artifact_type: process
    location: Microsoft-Windows-Sysmon/Operational Event ID 10
    sample: 'TargetImage=C:\Windows\System32\lsass.exe GrantedAccess=0x1010'
detections:
  - name: Non-system process opening LSASS
    data_source: Sysmon ProcessAccess Event ID 10
    query: 'EventID=10 AND TargetImage endswith "\\lsass.exe" AND SourceImage not startswith "C:\\Windows\\System32\\"'
    strategy: Alert when an unexpected process receives high-risk access rights to LSASS and correlate with dump-file creation.
    d3fend: [D3-OSM]
remedies:
  - name: Protect LSASS credential material
    priority: P0
    action: Enable Windows Defender Credential Guard and the ASR rule that blocks credential stealing from LSASS.
    verification: Confirm Credential Guard is running and repeat the lab action to verify the dump is blocked or denied.
cve_refs: []
related_techniques: [T1003]
sources:
  - title: 'MITRE ATT&CK T1003.001: LSASS Memory'
    url: https://attack.mitre.org/techniques/T1003/001/
    source_type: official
    accessed: '2026-09-17'
  - title: Microsoft Defender Credential Guard overview
    url: https://learn.microsoft.com/windows/security/identity-protection/credential-guard/
    source_type: vendor
    accessed: '2026-09-17'
