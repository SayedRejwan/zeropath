schema_version: '1.0'
technique_id: T1016.001
name: Internet Connection Discovery
description: 'Adversaries may check for Internet connectivity on compromised systems.
  This may be performed during automated discovery and can be accomplished in numerous
  ways such as using [Ping](https://attack.mitre.org/software/S0097), <code>tracert</code>,
  and GET requests to websites, or performing initial speed testing to confirm bandwidth.


  Adversaries may use the results and responses from these requests to determine if
  the system is capable of communicating with their C2 servers before attempting to
  connect to them. The results may also be used to identify routes, redirectors, and
  proxy servers.'
