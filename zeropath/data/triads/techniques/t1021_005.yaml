technique_id: T1021.005
name: VNC
description: 'Adversaries may use [Valid Accounts](https://attack.mitre.org/techniques/T1078)
  to remotely control machines using Virtual Network Computing (VNC).  VNC is a platform-independent
  desktop sharing system that uses the RFB (“remote framebuffer”) protocol to enable
  users to remotely control another computer’s display by relaying the screen, mouse,
  and keyboard inputs over the network.(Citation: The Remote Framebuffer Protocol)


  VNC differs from [Remote Desktop Protocol](https://attack.mitre.org/techniques/T1021/001)
  as VNC is screen-sharing software rather than resource-sharing software. By default,
  VNC uses the system''s authentication, but it can be configured to use credentials
  specific to VNC.(Citation: MacOS VNC software for Remote Desktop)(Citation: VNC
  Authentication)


  Adversaries may abuse VNC to perform malicious actions as the logged-on user such
  as opening documents, downloading files, and running arbitrary commands. An adversary
  could use VNC to remotely control and monitor a system to collect data and information
  to pivot to other systems within the network. Specific VNC libraries/implementations
  have also been susceptible to brute force attacks and memory usage exploitation.(Citation:
  Hijacking VNC)(Citation: macOS root VNC login without authentication)(Citation:
  VNC Vulnerabilities)(Citation: Offensive Security VNC Authentication Check)(Citation:
  Attacking VNC Servers PentestLab)(Citation: Havana authentication bug)'
