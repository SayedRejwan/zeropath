[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeropath"
version = "0.3.1"
description = "ZeroPath local validation agent with a reviewed ATT&CK triad knowledge base."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer==0.15.1",
  "rich==13.9.4",
  "click==8.1.7",
  "pydantic==2.10.6",
  "httpx==0.28.1",
  "PyYAML==6.0.2",
  "flask==3.0.2",
  "SQLAlchemy>=2.0,<3",
  "networkx>=3.0,<4",
  "numpy>=1.26,<3",
  "beautifulsoup4>=4.12,<5",
]

[project.scripts]
zeropath = "zeropath.cli:app"

[tool.setuptools.packages.find]
include = ["zeropath*", "scripts*"]

[tool.setuptools.package-data]
zeropath = ["configs/rooms/*.yaml", "lab/*.py", "lab/requirements.txt", "lab/Dockerfile",
            "data/triads/techniques/*.yaml", "data/triads/CATALOG.md", "data/thm_rooms/*.yaml",
            "data/thm_rooms/CATALOG.md"]

